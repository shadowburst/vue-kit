# Ralphy Configuration

project:
    name: 'vue-kit'
    language: 'TypeScript'
    framework: 'Vue'
    description: ''

commands:
    test: 'composer run test'
    lint: 'composer run check && pnpm run check'
    build: 'pnpm run build'

# Rules - instructions injected into every prompt
rules: []

# Boundaries - files/folders the AI must not modify
boundaries:
    never_touch: []

capabilities:
    browser: 'auto'
